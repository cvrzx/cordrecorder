name: Build CordRecorder dylib
on:
  workflow_dispatch:
  push:
    paths:
      - 'CordRecorder.m'
      - 'build.sh'
      - '.github/workflows/build-cordrecorder.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile iOS dylib
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CordRecorder-dylib
          path: CordRecorder.dylib
          if-no-files-found: error
